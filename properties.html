<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property ERP — Properties</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    document.documentElement.classList.add('boot-loading');
  </script>
</head>
<body class="bg-surface text-slate-800 antialiased" data-page="properties" data-role="Property Manager">
  <div id="app-shell" class="flex min-h-screen">
    <main class="min-w-0 flex-1">
      <div id="header-root"></div>
      <div class="space-y-6 p-4 sm:p-6">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-xl font-bold tracking-tight text-slate-900">Property Portfolio Analytics</h1>
            <p class="mt-1 text-sm text-slate-500">Photo-led assets with occupancy, collections, NOI and yield — drill into any property for full analysis.</p>
          </div>
          <div class="flex gap-2">
            <button type="button" data-action="import-csv" data-import="properties" class="rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-sm font-medium">Import CSV</button>
            <button type="button" data-action="open-modal" data-modal="add-property" class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Add Property</button>
          </div>
        </div>

        <div id="properties-kpis" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>

        <div class="flex flex-wrap items-center gap-2">
          <input id="properties-search" type="search" placeholder="Search name, location, code, manager…" class="min-w-[220px] flex-1 rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none focus:border-brand-300 focus:ring-2 focus:ring-brand-100 sm:max-w-md" />
          <select id="properties-type" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm">
            <option value="all">All types</option>
            <option value="Residential">Residential</option>
            <option value="Commercial">Commercial</option>
          </select>
          <select id="properties-status" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm">
            <option value="all">All statuses</option>
            <option value="Active">Active</option>
            <option value="Under maintenance">Under maintenance</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div id="properties-grid" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
      </div>
    </main>
  </div>
  <script src="js/loader.js"></script>
  <script src="js/money.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/uploads.js"></script>
  <script src="js/tables.js"></script>
  <script src="js/app.js"></script>
  <script src="js/properties-data.js"></script>
  <script src="js/properties-page.js"></script>
  <script src="js/whatsapp-bot.js"></script>
</body>
</html>
