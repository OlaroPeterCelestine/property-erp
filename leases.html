<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property ERP — Leases</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script>document.documentElement.classList.add('boot-loading');</script>
</head>
<body class="bg-surface text-slate-800 antialiased" data-page="leases" data-role="Property Manager">
  <div id="app-shell" class="flex min-h-screen">
    <main class="min-w-0 flex-1">
      <div id="header-root"></div>
      <div class="space-y-6 p-4 sm:p-6">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-xl font-bold tracking-tight text-slate-900">Lease Management</h1>
            <p class="mt-1 text-sm text-slate-500">Active agreements, renewals, escalations and terminations</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-action="open-modal" data-modal="add-lease" class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Create Lease</button>
          </div>
        </div>
        <div class="grid gap-4 sm:grid-cols-4">
          <div class="db-card p-5"><p class="text-sm text-slate-500">Active leases</p><p id="leases-stat-active" class="mt-1 text-2xl font-bold text-slate-900">—</p></div>
          <div class="db-card p-5"><p class="text-sm text-slate-500">Expiring 60 days</p><p id="leases-stat-expiring" class="mt-1 text-2xl font-bold text-amber-600">—</p></div>
          <div class="db-card p-5"><p class="text-sm text-slate-500">Renewals pending</p><p id="leases-stat-renewals" class="mt-1 text-2xl font-bold text-sky-600">—</p></div>
          <div class="db-card p-5"><p class="text-sm text-slate-500">Other / ended</p><p id="leases-stat-terminated" class="mt-1 text-2xl font-bold text-slate-900">—</p></div>
        </div>
        <section class="db-card overflow-hidden">
          <div data-table-toolbar class="flex flex-wrap items-center gap-2 border-b border-slate-100 p-4">
            <input data-table-search type="search" placeholder="Search leases…" class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:border-brand-300 focus:bg-white" />
          </div>
          <div class="overflow-x-auto">
            <table class="w-full min-w-[800px] text-left text-sm">
              <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-400">
                <tr>
                  <th class="px-5 py-3 font-medium">Lease Ref</th>
                  <th class="px-5 py-3 font-medium">Tenant</th>
                  <th class="px-5 py-3 font-medium">Unit</th>
                  <th class="px-5 py-3 font-medium">Rent</th>
                  <th class="px-5 py-3 font-medium">Start</th>
                  <th class="px-5 py-3 font-medium">Expiry</th>
                  <th class="px-5 py-3 font-medium">Status</th>
                  <th class="px-5 py-3 font-medium"></th>
                </tr>
              </thead>
              <tbody id="leases-table-body" class="divide-y divide-slate-100" data-filterable></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="js/loader.js"></script>
  <script src="js/money.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/uploads.js"></script>
  <script src="js/tables.js"></script>
  <script src="js/app.js"></script>
  <script src="js/properties-data.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/leases-page.js"></script>
  <script src="js/whatsapp-bot.js"></script>
</body>
</html>
